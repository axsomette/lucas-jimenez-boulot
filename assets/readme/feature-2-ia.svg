<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t"><title id="t">Développement assisté par IA</title><desc>La chaîne drupal-expert en sept étapes : scanner, builder, code-reviewer, verifier, backup, applier, post-check. L’applier attend trois feux verts.</desc><style>
.disp{font-family:Archivo,'Arial Black','Helvetica Neue',system-ui,sans-serif;font-weight:800;fill:#ECE8DF}
