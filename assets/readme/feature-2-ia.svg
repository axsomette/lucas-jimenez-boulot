@keyframes caret2{0%,24%{opacity:1}25%,49%{opacity:0}50%,74%{opacity:1}75%,99%{opacity:0}100%{opacity:1}}

.seg{transform-box:fill-box;transform-origin:0 50%;animation:seg 7s cubic-bezier(.65,0,.35,1) infinite both}
.node{animation:node 7s linear infinite both}
.gv{animation:gv 7s linear infinite both}
