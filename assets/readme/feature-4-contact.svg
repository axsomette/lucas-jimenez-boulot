<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-labelledby="t"><title id="t">Contact</title><desc>Formulaire de contact : nom, email, bouton « Envoyer le message » dont le curseur clignote pendant l’envoi. Réponse sous 48 h.</desc><style>
.disp{font-family:Archivo,'Arial Black','Helvetica Neue',system-ui,sans-serif;font-weight:800;fill:#ECE8DF}
.body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#A9B0C3}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#A9B0C3;letter-spacing:.12em}
.rise{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.blink{animation:blink 1.1s linear infinite both}
.draw{stroke-dasharray:1 1;stroke-dashoffset:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes caret2{0%,24%{opacity:1}25%,49%{opacity:0}50%,74%{opacity:1}75%,99%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important}}</style><path d="M3.5 0.5H596.5A3 3 0 0 1 599.5 3.5V317.5A22 22 0 0 1 577.5 339.5H3.5A3 3 0 0 1 0.5 336.5V3.5A3 3 0 0 1 3.5 0.5Z" fill="#11182E" stroke="#263156"/><rect x="28" y="30" width="6" height="12" fill="#F5B83D"/><text x="44" y="41" class="mono" font-size="11" style="fill:#A9B0C3">CONTACT</text><text x="28" y="80" class="disp" font-size="25" letter-spacing="-.3">Vous avez un projet ?</text><text x="28" y="106" class="body" font-size="14.5">Refonte, nouvelle application ou question technique :</text><text x="28" y="126" class="body" font-size="14.5">écrivez-moi ici ou sur LinkedIn.</text><text x="28" y="156" class="body" font-size="12.5" style="fill:#A9B0C3">Nom</text><path d="M30 164H326A2 2 0 0 1 328 166V188A10 10 0 0 1 318 198H30A2 2 0 0 1 28 196V166A2 2 0 0 1 30 164Z" fill="#0B1020" stroke="#3A4672"/><g class="rise" style="animation-delay:0.30s"><text x="42" y="186" class="body" font-size="14" style="fill:#ECE8DF">Camille</text></g><text x="28" y="212" class="body" font-size="12.5" style="fill:#A9B0C3">Email</text><path d="M30 220H326A2 2 0 0 1 328 222V244A10 10 0 0 1 318 254H30A2 2 0 0 1 28 252V222A2 2 0 0 1 30 220Z" fill="#0B1020" stroke="#3A4672"/><g class="rise" style="animation-delay:0.50s"><text x="42" y="242" class="body" font-size="14" style="fill:#ECE8DF">camille@example.com</text></g><g class="rise" style="animation-delay:.8s"><path d="M30 272H256A2 2 0 0 1 258 274V304A12 12 0 0 1 246 316H30A2 2 0 0 1 28 314V274A2 2 0 0 1 30 272Z" fill="#F5B83D"/><text x="222" y="300" class="body" text-anchor="end" font-size="15" font-weight="600" style="fill:#1B1403">Envoyer le message</text><rect class="blink" style="animation-delay:1.3s" x="230" y="286" width="7" height="16" fill="#1B1403"/></g><g class="rise" style="animation-delay:0.40s"><line x1="370" x2="572" y1="148" y2="148" stroke="#263156"/><text x="370" y="166" class="mono" font-size="10" style="fill:#8790A8">DÉLAI</text><text x="370" y="188" class="body" font-size="14" style="fill:#ECE8DF">Réponse sous 48 h</text></g><g class="rise" style="animation-delay:0.52s"><line x1="370" x2="572" y1="206" y2="206" stroke="#263156"/><text x="370" y="224" class="mono" font-size="10" style="fill:#8790A8">LINKEDIN</text><text x="370" y="246" class="body" font-size="14" style="fill:#ECE8DF">Lucas Jimenez Boulot</text></g><g class="rise" style="animation-delay:0.64s"><line x1="370" x2="572" y1="264" y2="264" stroke="#263156"/><text x="370" y="282" class="mono" font-size="10" style="fill:#8790A8">BASÉ À</text><text x="370" y="304" class="body" font-size="14" style="fill:#ECE8DF">Montpellier, Occitanie</text></g></svg>